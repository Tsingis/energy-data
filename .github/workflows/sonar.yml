name: sonar
on:
  push:
    branches:
      - main
    paths:
      - "server/src/**"
      - "server/tests/**"
      - "server/pyproject.toml"
      - "server/uv.lock"
      - "client/src/**"
      - "client/tests/**"
      - "client/config/**"
      - "client/package*.json"
      - "**/Dockerfile*"
      - ".github/workflows/sonar.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/src/**"
      - "server/tests/**"
      - "server/pyproject.toml"
      - "server/uv.lock"
      - "client/src/**"
      - "client/tests/**"
      - "client/config/**"
      - "client/package*.json"
      - "**/Dockerfile*"
      - ".github/workflows/sonar.yml"
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
